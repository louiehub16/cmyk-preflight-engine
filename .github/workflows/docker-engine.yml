name: Build and Push Engine Image

on:
  push:
    branches: [main]
    paths:
      - 'worker/Dockerfile'
      - 'worker/handler.py'
      - '.github/workflows/docker-engine.yml'
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hrm3478938
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: |
            hrm3478938/cmyk-preflight-engine:latest
            hrm3478938/cmyk-preflight-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
